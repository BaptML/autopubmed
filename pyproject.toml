[project]
name = "pubmed-veille"
version = "0.1.0"
description = "Lecteur de veille bibliographique médicale, local et auto-hébergé"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "python-dotenv>=1.0",
    # Exigé par FastAPI pour lire les formulaires HTML (écran de création).
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# `ruff format` fixe déjà la largeur du code ; E501 ne mordrait plus que sur des
# chaînes SQL ou des exemples de docstring qu'on ne coupe pas.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI : `Depends()`, `Form()`, `Query()` en argument par défaut, c'est l'idiome.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
