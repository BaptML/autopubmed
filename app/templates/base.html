<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veille PubMed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="barre-sup">
    <button class="bascule-barre" id="bascule-barre" type="button"
            title="Afficher ou masquer mes requêtes">⟨⟨</button>

    <div class="logo">
      <span class="logo-auto">Auto</span><span class="logo-pubmed">PubMed</span>
    </div>
    <span class="mono accroche">Veille quotidienne</span>

    <span class="pousse-droite"></span>
  </header>

  <div class="mise-en-page">
    {# Relecture périodique : le job de fond remplit le cache pendant la
       session, les compteurs de non-lus doivent suivre. Simple lecture en
       base, aucun appel à PubMed. #}
    <aside class="barre-laterale" id="barre-laterale"
           hx-get="/queries" hx-trigger="load, every 120s" hx-swap="innerHTML">
    </aside>

    <div class="poignee poignee-barre" data-cible="--sidebar-width"
         role="separator" aria-orientation="vertical" tabindex="0"
         title="Glisser pour redimensionner · double-clic pour réinitialiser"></div>

    <main class="panneau" id="panneau">
      <p class="vide-message">Sélectionne une requête dans la colonne de gauche.</p>
    </main>
  </div>

  <script>
    // Surbrillance de la requête ouverte. État purement visuel : la logique
    // reste côté serveur, en fragments HTML.
    let requeteActive = null;
    let articleActif = null;

    function marquerActive() {
      document.querySelectorAll('.lien-requete').forEach((el) => {
        el.classList.toggle('actif', el.dataset.queryId === requeteActive);
      });
    }

    function marquerArticle() {
      document.querySelectorAll('.article').forEach((el) => {
        el.classList.toggle('selectionne', el.id === articleActif);
      });
    }

    document.body.addEventListener('click', (event) => {
      const lien = event.target.closest('.lien-requete');
      if (lien) {
        requeteActive = lien.dataset.queryId;
        articleActif = null;  // changer de requête vide l'encart
        marquerActive();
        return;
      }
      const ligne = event.target.closest('.article');
      if (ligne && !event.target.closest('.lien-lecture')) {
        articleActif = ligne.id;
        marquerArticle();
      }
    });

    // Les fragments sont réécrits en permanence (barre latérale périodique,
    // ligne rejouée hors bande) : on repose la surbrillance après chaque
    // remplacement.
    document.body.addEventListener('htmx:afterSwap', (event) => {
      if (event.target.id === 'barre-laterale') marquerActive();
      marquerArticle();
    });

    // Colonnes étirables. Chaque poignée pilote une variable CSS de largeur ;
    // `sens` vaut -1 pour l'encart, dont le bord se déplace à l'inverse de sa
    // largeur puisqu'il est ancré à droite.
    const COLONNES = {
      '--sidebar-width': { cle: 'largeurBarre', defaut: 232, min: 180, max: 460, sens: 1 },
      '--panel-width': { cle: 'largeurEncart', defaut: 380, min: 260, max: 720, sens: -1 },
    };

    function poserLargeur(variable, valeur) {
      const col = COLONNES[variable];
      const borne = Math.min(col.max, Math.max(col.min, Math.round(valeur)));
      document.documentElement.style.setProperty(variable, borne + 'px');
      localStorage.setItem(col.cle, borne);
      return borne;
    }

    Object.entries(COLONNES).forEach(([variable, col]) => {
      const enregistre = parseInt(localStorage.getItem(col.cle), 10);
      poserLargeur(variable, Number.isNaN(enregistre) ? col.defaut : enregistre);
    });

    document.body.addEventListener('pointerdown', (event) => {
      const poignee = event.target.closest('.poignee');
      if (!poignee) return;
      const variable = poignee.dataset.cible;
      const col = COLONNES[variable];
      const departX = event.clientX;
      const departLargeur = parseInt(
        getComputedStyle(document.documentElement).getPropertyValue(variable), 10);

      poignee.setPointerCapture(event.pointerId);
      document.body.classList.add('redimensionne');

      const glisser = (e) => {
        poserLargeur(variable, departLargeur + (e.clientX - departX) * col.sens);
      };
      const relacher = () => {
        poignee.removeEventListener('pointermove', glisser);
        poignee.removeEventListener('pointerup', relacher);
        document.body.classList.remove('redimensionne');
      };
      poignee.addEventListener('pointermove', glisser);
      poignee.addEventListener('pointerup', relacher);
      event.preventDefault();
    });

    // Double-clic : retour à la largeur d'origine.
    document.body.addEventListener('dblclick', (event) => {
      const poignee = event.target.closest('.poignee');
      if (!poignee) return;
      const variable = poignee.dataset.cible;
      poserLargeur(variable, COLONNES[variable].defaut);
    });

    // Réglage au clavier, pour ne pas dépendre de la souris.
    document.body.addEventListener('keydown', (event) => {
      const poignee = event.target.closest('.poignee');
      if (!poignee || (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight')) return;
      const variable = poignee.dataset.cible;
      const col = COLONNES[variable];
      const pas = (event.key === 'ArrowRight' ? 16 : -16) * col.sens;
      const actuelle = parseInt(
        getComputedStyle(document.documentElement).getPropertyValue(variable), 10);
      poserLargeur(variable, actuelle + pas);
      event.preventDefault();
    });

    // Repli de la barre latérale, conservé d'une session à l'autre.
    const bascule = document.getElementById('bascule-barre');

    function appliquerRepli(replie) {
      document.body.classList.toggle('barre-repliee', replie);
      bascule.textContent = replie ? '⟩⟩' : '⟨⟨';
    }

    appliquerRepli(localStorage.getItem('barreRepliee') === '1');
    bascule.addEventListener('click', () => {
      const replie = !document.body.classList.contains('barre-repliee');
      localStorage.setItem('barreRepliee', replie ? '1' : '0');
      appliquerRepli(replie);
    });
  </script>
</body>
</html>
